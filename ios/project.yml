name: Kshana
options:
  bundleIdPrefix: com.gourabdash
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
packages:
  KshanaCore:
    path: KshanaCore
targets:
  Kshana:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Models
        type: folder
      - path: App/Resources/Tokenizer
        type: folder
    dependencies:
      - package: KshanaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gourabdash.kshana
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kshana
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save generated images to your photo library.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
